<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aman Verma — Engineering Growth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A5EA6"/>
      <stop offset="1" stop-color="#0E3A66"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- faint baseline grid, echoing the dossier's blueprint paper -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.14">
    <line x1="6" y1="12" x2="26" y2="12"/>
    <line x1="6" y1="18" x2="26" y2="18"/>
    <line x1="6" y1="24" x2="26" y2="24"/>
  </g>
  <!-- rising growth curve: "does it run?" -> "does it scale?" -->
  <path d="M6 24 C 11 23, 13 18.5, 17 15 S 23 9, 26 7"
        fill="none" stroke="#FFFFFF" stroke-width="2.4"
        stroke-linecap="round"/>
  <!-- start node -->
  <circle cx="6" cy="24" r="1.9" fill="#FFFFFF"/>
  <!-- "now" node, teal accent matching the site -->
  <circle cx="26" cy="7" r="3.2" fill="#16C79A" stroke="#FFFFFF" stroke-width="1.4"/>
</svg>
