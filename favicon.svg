<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aman Verma — AV monogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A5EA6"/>
      <stop offset="1" stop-color="#0E3A66"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- AV monogram, serif to match the dossier's headings -->
  <text x="16" y="22.4" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="700" letter-spacing="-0.5"
        fill="#FFFFFF">AV</text>
  <!-- teal accent underline, matching the site's "now" node -->
  <rect x="10" y="25.4" width="12" height="2" rx="1" fill="#16C79A"/>
</svg>
